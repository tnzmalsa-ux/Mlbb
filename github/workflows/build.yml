name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inspect and Build
        run: |
          ls -la
          for f in *.zip; do [ -e "$f" ] && unzip -o "$f"; done
          GRADLEW_FILE=$(find . -maxdepth 4 -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_FILE" ]; then
            echo "No gradlew found! Files inside:"
            find . -maxdepth 3 -not -path '*/.*'
            exit 1
          fi
          cd "$(dirname "$GRADLEW_FILE")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
